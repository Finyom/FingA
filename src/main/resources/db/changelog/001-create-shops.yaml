databaseChangeLog:
  - changeSet:
      id: 001-create-shops
      author: finga
      changes:
        - createTable:
            tableName: shops
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: name
                  type: VARCHAR(120)
                  constraints: { nullable: false }
              - column:
                  name: description
                  type: VARCHAR(500)
              - column:
                  name: address
                  type: VARCHAR(255)
                  constraints: { nullable: false }
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints: { nullable: false }
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints: { nullable: false }
