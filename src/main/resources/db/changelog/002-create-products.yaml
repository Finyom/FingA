databaseChangeLog:
  - changeSet:
      id: 002-create-products
      author: finga
      changes:
        - createTable:
            tableName: products
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: name
                  type: VARCHAR(150)
                  constraints: { nullable: false }
              - column:
                  name: description
                  type: VARCHAR(1000)
              - column:
                  name: price
                  type: NUMERIC(12,2)
                  constraints: { nullable: false }
              - column:
                  name: stock
                  type: INTEGER
                  constraints: { nullable: false }
              - column:
                  name: shop_id
                  type: BIGINT
                  constraints: { nullable: false }
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints: { nullable: false }
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints: { nullable: false }
        - addForeignKeyConstraint:
            baseTableName: products
            baseColumnNames: shop_id
            referencedTableName: shops
            referencedColumnNames: id
            constraintName: fk_products_shop
            onDelete: CASCADE
        - createIndex:
            tableName: products
            indexName: idx_products_shop_id
            columns:
              - column: { name: shop_id }
