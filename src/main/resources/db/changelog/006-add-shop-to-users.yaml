databaseChangeLog:

  - changeSet:
      id: 006-create-user-shops
      author: ghislain

      changes:

        - createTable:
            tableName: user_shops

            columns:

              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: shop_id
                  type: BIGINT
                  constraints:
                    nullable: false

        - addPrimaryKey:
            tableName: user_shops
            columnNames: user_id, shop_id
            constraintName: pk_user_shops

        - addForeignKeyConstraint:
            baseTableName: user_shops
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_user_shops_user
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableName: user_shops
            baseColumnNames: shop_id
            referencedTableName: shops
            referencedColumnNames: id
            constraintName: fk_user_shops_shop
            onDelete: CASCADE