  databaseChangeLog:
    - changeSet:
        id: 013-create-product-photos
        author: finga
        changes:
          - createTable:
              tableName: product_photos
              columns:
                - column:
                    name: id
                    type: BIGINT
                    autoIncrement: true
                    constraints:
                      primaryKey: true
                      nullable: false

                - column:
                    name: product_id
                    type: BIGINT
                    constraints:
                      nullable: false

                - column:
                    name: photo_path
                    type: VARCHAR(500)
                    constraints:
                      nullable: false

          - addForeignKeyConstraint:
              baseTableName: product_photos
              baseColumnNames: product_id
              referencedTableName: products
              referencedColumnNames: id
              constraintName: fk_product_photos_product

          - createIndex:
              tableName: product_photos
              indexName: idx_product_photos_product_id
              columns:
                - column:
                    name: product_id

